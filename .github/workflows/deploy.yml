name: Deploy to GitHub Pages

# Publishes the static site on every push to the default branch.
# In the repo settings, set Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog JSON
        run: |
          node -e "const p=require('./data/photos.json'); if(!Array.isArray(p)||!p.length){throw new Error('Empty catalog')}; console.log('Catalog OK:', p.length, 'works')"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
