<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery — Visualart</title>
    <meta
      name="description"
      content="Browse the full Visualart gallery — thousands of original photographs across eight collections, each available on gallery-wrapped canvas."
    />
    <meta name="theme-color" content="#0c0c0e" />

    <meta property="og:title" content="Gallery — Visualart" />
    <meta property="og:description" content="Browse original photography on gallery canvas." />
    <meta property="og:image" content="https://picsum.photos/seed/va_010/1200/630" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://picsum.photos" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script>
      try {
        var t = localStorage.getItem("va-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="site-header"></div>

    <main class="wrap gallery-page">
      <div class="page-head">
        <span class="eyebrow">The Collection</span>
        <h1 id="gallery-title">The Gallery</h1>
      </div>

      <!-- Toolbar: search + filters + sort -->
      <div class="toolbar" role="search">
        <div class="search">
          <span class="search__icon" data-icon="search"></span>
          <label class="visually-hidden" for="gallery-search">Search photographs</label>
          <input id="gallery-search" type="search" placeholder="Search by title or tag…" autocomplete="off" />
        </div>
        <div class="filters" id="filter-chips" role="group" aria-label="Filter by collection"></div>
        <div class="toolbar__right">
          <span class="result-count" id="result-count" aria-live="polite"></span>
          <div class="select">
            <label class="visually-hidden" for="sort-select">Sort</label>
            <select id="sort-select">
              <option value="curated">Curated</option>
              <option value="featured">Featured first</option>
              <option value="title">Title A–Z</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="newest">Newest</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Masonry grid -->
      <div class="masonry" id="gallery-grid" aria-live="polite"></div>

      <!-- Empty state -->
      <div class="empty hide" id="gallery-empty">
        <div class="empty__icon" data-icon="image"></div>
        <h3>Nothing matches just yet</h3>
        <p>Try a different collection or clear your search to see everything.</p>
        <button class="btn btn--ghost" id="clear-filters" style="margin-top:1.5rem">Clear filters</button>
      </div>

      <!-- Infinite scroll loader -->
      <div class="loader hide" id="gallery-loader"><span class="spinner"></span></div>
      <div class="sentinel" id="gallery-sentinel"></div>
    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photograph preview">
      <button class="lightbox__close" id="lb-close" aria-label="Close preview" data-icon="close"></button>
      <button class="lightbox__nav lightbox__nav--prev" id="lb-prev" aria-label="Previous" data-icon="chevronLeft"></button>
      <button class="lightbox__nav lightbox__nav--next" id="lb-next" aria-label="Next" data-icon="chevronRight"></button>
      <figure class="lightbox__figure">
        <img class="lightbox__img" id="lb-img" alt="" />
        <figcaption class="lightbox__caption">
          <div>
            <h3 id="lb-title"></h3>
            <span class="lightbox__caption-meta" id="lb-meta"></span>
          </div>
          <a class="btn btn--primary" id="lb-cta" href="#">View &amp; Order
            <span class="btn__icon btn__icon--arrow"></span>
          </a>
        </figcaption>
      </figure>
    </div>

    <div id="site-footer"></div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/gallery.js"></script>
  </body>
</html>
