# Visualart — Netlify configuration
# Static site, no build step. Publishes the repo root as-is.

[build]
  publish = "."
  command = ""

# Long-cache the immutable-ish assets; HTML stays fresh.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Friendly 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
